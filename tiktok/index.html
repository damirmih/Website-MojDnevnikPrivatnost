<!-- Stranica za link u TikTok bio-u. Bez spoljnih fontova, skripti i slika (ikonica je ugrađena),
     pa ne šalje ništa trećim stranama. Kad Android izađe na Google Play, postavi playLive na true. -->
<style>
  :root {
    --ground: #F2F5F6; --surface: #FFFFFF; --ink: #14232C; --ink-soft: #4A5D68;
    --rule: #DCE3E6; --accent: #96212F; --accent-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(20,35,44,.06), 0 8px 24px -12px rgba(20,35,44,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0B141A; --surface: #131F27; --ink: #E8EFF2; --ink-soft: #A6B7C0;
      --rule: #24343D; --accent: #C2394A; --accent-ink: #FFFFFF;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 28rem; margin: 0 auto; padding: 40px 16px 32px; text-align: center; }
  .icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: var(--shadow); display: block; margin: 0 auto 18px; }
  h1 { font-size: 1.8rem; line-height: 1.15; margin: 0 0 8px; }
  .lead { color: var(--ink-soft); font-size: 1.05rem; margin: 0 0 22px; }
  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; text-align: left; }
  .btn {
    display: flex; align-items: center; justify-content: center; min-height: 54px; width: 100%;
    border-radius: 14px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
    font: inherit; font-weight: 600; font-size: 1.05rem; text-decoration: none; padding: 0 16px; margin-top: 10px;
  }
  .btn:first-child { margin-top: 0; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .hint { color: var(--ink-soft); font-size: .92rem; margin: 10px 2px 0; text-align: center; }
  #soon { margin-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0 8px 26px; position: relative; border-top: 1px solid var(--rule); }
  li:first-child { border-top: 0; }
  li::before { content: "✓"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }
  footer { color: var(--ink-soft); font-size: .85rem; margin-top: 8px; }
  footer a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>

  <h1>Moj Dnevnik</h1>
  <p class="lead" id="lead"></p>

  <section class="card">
    <a class="btn primary" id="ios" href="#" hidden></a>
    <a class="btn primary" id="android" href="#" hidden></a>
    <p class="hint" id="soon" hidden></p>
    <p class="hint" id="desktop" hidden></p>
  </section>

  <section class="card">
    <ul id="points"></ul>
  </section>

    <span id="free"></span>
    <a id="privacyLink" href="../"></a>
  </footer>

<script>
(function () {
  "use strict";

  // Podešavanja. playLive: true čim Android izađe na Google Play.
  // iosProviderToken je „pt" iz App Store Connect → Analytics → Campaigns (može i prazno).
  var CONFIG = {
    iosId: "6808085105",
    iosProviderToken: "",
    playPackage: "com.mateja.mygrades",
    playLive: false,
    campaign: "tiktok"
  };

  var TEXT = {
    sr: {
      lead: "Ocene, prosek i raspored časova na jednom mestu.",
      ios: "Preuzmi na App Store-u", android: "Preuzmi na Google Play-u",
      soon: "Android verzija uskoro stiže na Google Play.",
      desktop: "Otvori ovu stranicu na telefonu da preuzmeš aplikaciju.",
      points: [
        "Prosek i zaključna ocena, i šta ti treba za veću",
        "Raspored časova, i na zaključanom ekranu",
        "Obaveze i podsetnici za kontrolne",
        "Obaveštenje pre kraja časa"
      ],
      free: "Besplatno, bez naloga i bez reklama.", privacy: "Politika privatnosti"
    },
    en: {
      lead: "Grades, averages and your class schedule in one place.",
      ios: "Download on the App Store", android: "Get it on Google Play",
      soon: "The Android version is coming soon to Google Play.",
      desktop: "Open this page on your phone to download the app.",
      points: [
        "Your average and final grade, and what you need for a higher one",
        "Class schedule, also on the lock screen",
        "Tasks and reminders for tests",
        "Alert before the end of class"
      ],
      free: "Free, no account and no ads.", privacy: "Privacy policy"
    }
  };

  var lang = (navigator.language || "sr").toLowerCase().indexOf("en") === 0 ? "en" : "sr";
  var T = TEXT[lang];
  document.documentElement.lang = lang;

  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  var iosUrl = "https://apps.apple.com/app/id" + CONFIG.iosId + "?ct=" + CONFIG.campaign +
    (CONFIG.iosProviderToken ? "&pt=" + encodeURIComponent(CONFIG.iosProviderToken) : "");
  var playUrl = "https://play.google.com/store/apps/details?id=" + CONFIG.playPackage +
    "&referrer=" + encodeURIComponent("utm_source=" + CONFIG.campaign + "&utm_medium=bio&utm_campaign=" + CONFIG.campaign);

  function $(id) { return document.getElementById(id); }

  $("lead").textContent = T.lead;
  $("free").textContent = T.free + " ";
  $("privacyLink").textContent = T.privacy;
  T.points.forEach(function (text) {
    var li = document.createElement("li");
    li.textContent = text;
    $("points").appendChild(li);
  });

  var ios = $("ios"), android = $("android");
  ios.textContent = T.ios; ios.href = iosUrl;
  android.textContent = T.android; android.href = playUrl;

  if (isIOS) {
    ios.hidden = false;
  } else if (isAndroid) {
    if (CONFIG.playLive) android.hidden = false;
    else { $("soon").textContent = T.soon; $("soon").hidden = false; }
  } else {
    // Računar: obe prodavnice (Google Play tek kad je živ), uz napomenu da se otvori na telefonu.
    ios.hidden = false;
    if (CONFIG.playLive) { android.hidden = false; android.className = "btn"; }
    $("desktop").textContent = T.desktop; $("desktop").hidden = false;
  }
})();
</script>
